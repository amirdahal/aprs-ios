name: aprs
description: "An APRS application for all radios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  radio:
    git: https://neuro-pm.com/git/CSSI/RadioLibraryFlutter.git
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.1
  custom_events: ^0.0.5
  toastification: ^1.0.0
  mbtiles: ^0.4.2
  path_provider: ^2.1.5
  latlong2: ^0.9.1
  flutter_map: ^8.1.1
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.34
  location: ^8.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/phhi.omm.mbtiles